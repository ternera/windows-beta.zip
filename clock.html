<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to June 19, 2027</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #add8e6;
            overflow: hidden;
            margin: 0;
            background-image: radial-gradient(circle, #e0e0e0, #c0c0c0);
        }
        #countdown {
            text-align: center;
            font-size: 8em;
            z-index: 1;
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
        }
        .balloon {
            position: absolute;
            bottom: -100px;
          width: 58px;
          height: 74px;
          background: radial-gradient(circle at 30% 25%, #ff8a8a 0 8%, #f44336 38%, #b40000 100%);
          border-radius: 50% 50% 45% 45%;
          box-shadow: inset -7px -8px 10px rgba(100, 0, 0, 0.24), 0 4px 8px rgba(0, 0, 0, 0.18);
          animation: float 7s ease-in-out infinite;
            z-index: 0;
        }
        .balloon::before {
          content: "";
          position: absolute;
          left: 50%;
          bottom: -7px;
          width: 12px;
          height: 12px;
          background: #b40000;
          transform: translateX(-50%) rotate(45deg);
          border-radius: 2px;
        }
        .balloon::after {
          content: "";
          position: absolute;
          left: 50%;
          top: 80px;
          width: 2px;
          height: 190px;
          background: #111;
          transform: translateX(-50%) rotate(var(--string-angle, 2deg));
          transform-origin: top center;
          opacity: 0.85;
        }
        .balloon:nth-of-type(2) {
          --string-angle: -4deg;
          animation-delay: -1.5s;
          animation-duration: 8.5s;
        }
        .balloon:nth-of-type(3) {
          --string-angle: 5deg;
          animation-delay: -3.2s;
          animation-duration: 6.5s;
        }
        .balloon:nth-of-type(4) {
          --string-angle: -3deg;
          animation-delay: -4.4s;
          animation-duration: 9s;
        }
        @keyframes float {
            0% {
            transform: translate(0, 0) rotate(-3deg);
            }
          35% {
            transform: translate(22px, -250px) rotate(5deg);
          }
          68% {
            transform: translate(-18px, -470px) rotate(-5deg);
            }
            100% {
            transform: translate(8px, -720px) rotate(3deg);
            }
        }
        @media (max-width: 600px) {
            #countdown {
                font-size: 4em;
            }
        }
    </style>
</head>
<body>
    <div id="countdown"></div>
    <div class="balloon" style="left: 20%; animation-delay: 0s;"></div>
    <div class="balloon" style="left: 40%; animation-delay: 1s;"></div>
    <div class="balloon" style="left: 60%; animation-delay: 2s;"></div>
    <div class="balloon" style="left: 80%; animation-delay: 3s;"></div>

    <script>
function updateCountdown() {
      const now = new Date();
      const targetDate = new Date('June 19, 2027 14:30:00');

      if (now >= targetDate) {
        document.getElementById('countdown').innerText = "EXPIRED";
        return;
      }

      let years = targetDate.getFullYear() - now.getFullYear();
      let months = targetDate.getMonth() - now.getMonth();
      let days = targetDate.getDate() - now.getDate();
      let hours = targetDate.getHours() - now.getHours();
      let minutes = targetDate.getMinutes() - now.getMinutes();
      let seconds = targetDate.getSeconds() - now.getSeconds();

      if (seconds < 0) {
        seconds += 60;
        minutes--;
      }
      if (minutes < 0) {
        minutes += 60;
        hours--;
      }
      if (hours < 0) {
        hours += 24;
        days--;
      }

      if (days < 0) {
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
        months--;
      }

      if (months < 0) {
        months += 12;
        years--;
      }

      document.getElementById('countdown').innerText = 
        `${years}y ${months}mo ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
